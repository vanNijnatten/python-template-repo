name: Smoke Test


on:
    push:
        branches:
            - main
            - master
            - patch/**
    
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
        branches:
            - main
            - master
            - patch/**


concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true


permissions:
    contents: read # to fetch code (actions/checkout)
    pull-requests: read # to list changed files (dorny/paths-filter)


defaults:
    run:
        shell: bash


env:
    SRC_PATH: src
    TST_PATH: tests
    TF_PATH: terraform


jobs:
    changes:
        name: Detect Changes
        runs-on: ubuntu-latest
        if: github.event.pull_request.draft == false
        outputs:
            python: ${{ steps.filter.outputs.python }}
            terraform: ${{ steps.filter.outputs.terraform }}

        steps:
            - name: checkout
              uses: actions/checkout@v7

            - name: Filter changed paths
              id: filter
              uses: dorny/paths-filter@v4.0.3
              with:
                filters: |
                  python:
                    - 'src/**'
                    - 'tests/**'
                    - 'pyproject.toml'
                    - 'uv.lock'
                    - '.github/workflows/**'
                  terraform:
                    - 'terraform/**'
                    - '.github/workflows/**'

    static_analysis:
        name: Static Analysis
        runs-on: ubuntu-latest
        needs:
            - changes
        if: needs.changes.outputs.python == 'true'

        steps:
            - name: checkout
              uses: actions/checkout@v7

            - name: Install UV
              uses: astral-sh/setup-uv@v10.4.0

            - name: Install the project
              run: |
                uv sync \
                  --locker \
                  --all-extras

            - name: Run Ruff
              run: |
                uv run ruff check $SRC_PATH $TST_PATH \
                  --no-fix \
                  --output-format=github

            - name: Run MyPy
              run: |
                uv run mypy $SRC_PATH \
                  --config-file pyproject.toml \
                  --output=json \
                  | jq -r '"::error title=Mypy issue,file=\(.file),line=\(.line),col=\(.column)::\(.message)"'

            - name: Run Bandit
              run: |
                {
                  echo "Bandit:"
                  echo "\`\`\`"
                  uv run bandit $SRC_PATH \
                    -c pyproject.toml \
                    -r \
                    -n 3 \
                    -lll
                  echo "\`\`\`"
                } >> $GITHUB_STEP_SUMMARY

            - name: Run Radon
              run: |
                {
                  echo "Radon:"
                  echo "\`\`\`"
                  uv run radon cc $SRC_PATH
                  echo "\`\`\`"
                }  >> $GITHUB_STEP_SUMMARY

    smoke_test:
        name: Smoke Test
        runs-on: ubuntu-latest
        needs:
            - static_analysis

        steps:
            - name: checkout
              uses: actions/checkout@v7

            - name: Install UV
              uses: astral-sh/setup-uv@v10.4.0

            - name: Install the project
              run: |
                uv sync \
                --locker \
                --all-extras

            - name: Run tests
              run: |
                uv run pytest $SRC_PATH $TST_PATH \
                  --cov=$SRC_PATH \
                  --doctest-modules \
                  --cov-report markdown-append:$GITHUB_STEP_SUMMARY

    terraform_validate:
        name: Terraform Validate
        runs-on: ubuntu-latest
        needs:
            - changes
        if: needs.changes.outputs.terraform == 'true'

        defaults:
            run:
                working-directory: ${{ env.TF_PATH }}

        steps:
            - name: checkout
              uses: actions/checkout@v7

            - name: Install Terraform
              uses: hashicorp/setup-terraform@v4
              with:
                terraform_wrapper: false
                terraform_version: "1.17.2"

            - name: Check formatting
              run: |
                terraform fmt \
                  -check \
                  -recursive \
                  -diff

            # No backend: validation needs no Azure credentials or state access.
            - name: Init
              run: |
                terraform init \
                  -backend=false \
                  -input=false

            - name: Validate
              run: |
                terraform validate -no-color
